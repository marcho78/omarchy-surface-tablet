# Surface Pro 4: the built-in mics record far too hot at WirePlumber's default
# of 100% for a mic (+60 dB across the codec's Capture and Internal Mic Boost):
# room sound alone clips, and dictation can't make out words. 35% (Capture
# +30 dB, no boost) leaves room for speech. This is only the starting level
# when nothing is saved; the Sound page's Microphone slider still changes it.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3" }
    ]
    actions = {
      update-props = {
        # Linear, as WirePlumber stores it: 0.35 cubed (35% on the slider).
        device.routes.default-source-volume = 0.042875
      }
    }
  }
]
